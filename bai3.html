<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đổi năm dương lịch sang âm lịch</title>
</head>
<body>
    <h2>Đổi năm dương lịch sang năm âm lịch</h2>
    <input type="number" id="nam_duong_lich" placeholder="Nhập năm dương lịch">
    <button onclick="doiNamAmLich()">Xem năm âm lịch</button>
    <h3 id="ket_qua"></h3>

    <script>
        function doiNamAmLich() {
            let nam_duong_lich = parseInt(document.getElementById("nam_duong_lich").value);
            if (isNaN(nam_duong_lich)) {
                document.getElementById("ket_qua").innerText = "Vui lòng nhập năm hợp lệ!";
                return;
            }

            let can = "";
            let chi = "";

            switch (nam_duong_lich % 10) {
                case 0: can = "Canh"; break;
                case 1: can = "Tân"; break;
                case 2: can = "Nhâm"; break;
                case 3: can = "Quý"; break;
                case 4: can = "Giáp"; break;
                case 5: can = "Ất"; break;
                case 6: can = "Bính"; break;
                case 7: can = "Đinh"; break;
                case 8: can = "Mậu"; break;
                case 9: can = "Kỷ"; break;
            }

            switch (nam_duong_lich % 12) {
                case 0: chi = "Thân"; break;
                case 1: chi = "Dậu"; break;
                case 2: chi = "Tuất"; break;
                case 3: chi = "Hợi"; break;
                case 4: chi = "Tý"; break;
                case 5: chi = "Sửu"; break;
                case 6: chi = "Dần"; break;
                case 7: chi = "Mẹo"; break;
                case 8: chi = "Thìn"; break;
                case 9: chi = "Tỵ"; break;
                case 10: chi = "Ngọ"; break;
                case 11: chi = "Mùi"; break;
            }

            document.getElementById("ket_qua").innerText = 
                "Năm " + nam_duong_lich + " là năm: " + can + " " + chi;
        }
    </script>
</body>
</html>
