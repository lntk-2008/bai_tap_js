<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra năm nhuận</title>
</head>
<body>
    <h2>Kiểm tra năm nhuận</h2>
    <input type="number" id="yearInput" placeholder="Nhập vào năm cần kiểm tra">
    <button onclick="kiemTraNamNhuan()">Kiểm tra</button>
    <h3 id="result"></h3>

    <script>
        function kiemTraNamNhuan() {
            let year = parseInt(document.getElementById("yearInput").value);
            if (isNaN(year)) {
                document.getElementById("result").innerText = "Vui lòng nhập một năm hợp lệ!";
                return;
            }

            let isLeapYear = false;
            if ((year % 400 === 0) || (year % 4 === 0 && year % 100 !== 0)) {
                isLeapYear = true;
            }

            if (isLeapYear) {
                document.getElementById("result").innerText = year + ": năm nhuận";
            } else {
                document.getElementById("result").innerText = year + ": năm không nhuận";
            }
        }
    </script>
</body>
</html>
