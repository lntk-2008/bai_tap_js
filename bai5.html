<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính số ngày trong tháng</title>
    <style>
        .box {
            border: 1px solid #333;
            width: 320px;
            padding: 15px;
            font-family: "Times New Roman", serif;
        }
        #ket_qua_ngay {
            font-size: 18px;
            margin-top: 15px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <input type="number" id="thang" placeholder="Nhập tháng (1-12)">
        <button onclick="tinhSoNgay()">Tính số ngày</button>
        <p id="ket_qua_ngay"></p>
    </div>

    <script>
        function tinhSoNgay() {
            let thang = parseInt(document.getElementById("thang").value);
            let ketQua = "";

            switch (thang) {
                case 1:
                case 3:
                case 5:
                case 7:
                case 8:
                case 10:
                case 12:
                    ketQua = "Tháng " + thang + " có 31 ngày";
                    break;
                case 2:
                    ketQua = "Tháng 2 có 28 hoặc 29 ngày";
                    break;
                case 4:
                case 6:
                case 9:
                case 11:
                    ketQua = "Tháng " + thang + " có 30 ngày";
                    break;
                default:
                    ketQua = "Tháng không hợp lệ (nhập từ 1 đến 12)";
            }

            document.getElementById("ket_qua_ngay").innerText = ketQua;
        }
    </script>
</body>
</html>
