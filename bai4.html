<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu giá hoa quả</title>
    <style>
        .box {
            border: 1px solid #333;
            width: 320px;
            padding: 15px;
            font-family: "Times New Roman", serif;
        }
        h2 {
            margin-top: 0;
        }
        #gia_tien {
            font-size: 20px;
            margin-top: 15px;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Giá hoa quả</h2>
        <input type="text" id="ten_hoa_qua" placeholder="Ví dụ: Măng Cụt">
        <button onclick="xemGia()">Xem giá</button>
        <p id="gia_tien"></p>
    </div>

    <script>
        function xemGia() {
            let ten = document.getElementById("ten_hoa_qua").value.trim().toLowerCase();
            let ketQua = "";

            switch (ten) {
                case "ổi":
                case "dưa hấu":
                    ketQua = "20000 VNĐ/kg";
                    break;
                case "táo":
                    ketQua = "30000 VNĐ/kg";
                    break;
                case "cam":
                case "chôm chôm":
                    ketQua = "40000 VNĐ/kg";
                    break;
                case "măng cụt":
                    ketQua = "50000 VNĐ/kg";
                    break;
                default:
                    ketQua = "Tìm không thấy";
            }

            document.getElementById("gia_tien").innerText = ketQua;
        }
    </script>
</body>
</html>
